<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="controltitle"><title id="controltitle">Source coverage versus processing accounting; conservative external-effect cancellation boundary</title><defs><marker id="ca" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#48776a" stroke-width="1.5"/></marker></defs><rect width="1100" height="700" rx="18" fill="#edf2e7"/><text x="30" y="35" font-family="system-ui" font-size="14" font-weight="700" fill="#254d45">A / SOURCE COVERAGE IS NOT PROCESSING ACCOUNTING</text><rect x="30" y="60" width="290" height="95" rx="12" fill="#fffef8" stroke="#abc7b5"/><text x="46" y="89" font-family="system-ui" font-size="17" font-weight="650" fill="#254d45">Independent source inventory</text><text x="46" y="114" font-family="system-ui" font-size="12" font-weight="400" fill="#254d45">Method, time window, provenance</text><text x="46" y="132" font-family="system-ui" font-size="12" font-weight="400" fill="#254d45">May share failure modes with intake</text><rect x="405" y="60" width="290" height="95" rx="12" fill="#fffef8" stroke="#abc7b5"/><text x="421" y="89" font-family="system-ui" font-size="17" font-weight="650" fill="#254d45">Received source revisions</text><text x="421" y="114" font-family="system-ui" font-size="12" font-weight="400" fill="#254d45">Stable identity + revision policy</text><text x="421" y="132" font-family="system-ui" font-size="12" font-weight="400" fill="#254d45">This is the captured denominator</text><rect x="780" y="60" width="290" height="95" rx="12" fill="#fffef8" stroke="#abc7b5"/><text x="796" y="89" font-family="system-ui" font-size="17" font-weight="650" fill="#254d45">Compare inventory ↔ received</text><text x="796" y="114" font-family="system-ui" font-size="12" font-weight="400" fill="#254d45">Known delta or unknown denominator</text><text x="796" y="132" font-family="system-ui" font-size="12" font-weight="400" fill="#254d45">A healthy session is not completeness</text><path d="M175 60V48H925V60" stroke="#48776a" fill="none" stroke-width="2" marker-end="url(#ca)"/><path d="M695 106L775 106" stroke="#48776a" fill="none" stroke-width="2" marker-end="url(#ca)"/><rect x="30" y="205" width="490" height="95" rx="12" fill="#fffef8" stroke="#abc7b5"/><text x="46" y="234" font-family="system-ui" font-size="17" font-weight="650" fill="#254d45">Processing conservation</text><text x="46" y="259" font-family="system-ui" font-size="12" font-weight="400" fill="#254d45">Pending + excluded + quarantined + failed + assessed</text><text x="46" y="277" font-family="system-ui" font-size="12" font-weight="400" fill="#254d45">Zero-candidate assessments have reasons, audit and replay</text><rect x="580" y="205" width="490" height="95" rx="12" fill="#fffef8" stroke="#abc7b5"/><text x="596" y="234" font-family="system-ui" font-size="17" font-weight="650" fill="#254d45">Freshness and candidate meaning</text><text x="596" y="259" font-family="system-ui" font-size="12" font-weight="400" fill="#254d45">Aged pending is a processing gap, not proof of source loss</text><text x="596" y="277" font-family="system-ui" font-size="12" font-weight="400" fill="#254d45">Many source revisions ↔ many candidates; admission is separate</text><path d="M550 155V180H275V200" stroke="#48776a" fill="none" stroke-width="2" marker-end="url(#ca)"/><path d="M520 251L575 251" stroke="#48776a" fill="none" stroke-width="2" marker-end="url(#ca)"/><text x="30" y="353" font-family="system-ui" font-size="14" font-weight="700" fill="#254d45">B / LOCAL FENCING DOES NOT UNDO AN OUTSIDE EFFECT</text><rect x="30" y="385" width="230" height="95" rx="12" fill="#fffef8" stroke="#abc7b5"/><text x="46" y="414" font-family="system-ui" font-size="17" font-weight="650" fill="#254d45">Grant / cancel epoch</text><text x="46" y="439" font-family="system-ui" font-size="12" font-weight="400" fill="#254d45">Current scope and policy</text><text x="46" y="457" font-family="system-ui" font-size="12" font-weight="400" fill="#254d45">Stop fences later boundaries</text><rect x="300" y="385" width="230" height="95" rx="12" fill="#fffef8" stroke="#abc7b5"/><text x="316" y="414" font-family="system-ui" font-size="17" font-weight="650" fill="#254d45">Fenced claim</text><text x="316" y="439" font-family="system-ui" font-size="12" font-weight="400" fill="#254d45">Persist attempt identity</text><text x="316" y="457" font-family="system-ui" font-size="12" font-weight="400" fill="#254d45">Claim ≠ transmitted</text><rect x="570" y="385" width="230" height="95" rx="12" fill="#fff0ce" stroke="#abc7b5"/><text x="586" y="414" font-family="system-ui" font-size="17" font-weight="650" fill="#254d45">Transmit-start marker</text><text x="586" y="439" font-family="system-ui" font-size="12" font-weight="400" fill="#254d45">Persist before network call</text><text x="586" y="457" font-family="system-ui" font-size="12" font-weight="400" fill="#254d45">Means MAY have transmitted</text><rect x="840" y="385" width="230" height="95" rx="12" fill="#fffef8" stroke="#abc7b5"/><text x="856" y="414" font-family="system-ui" font-size="17" font-weight="650" fill="#254d45">External provider</text><text x="856" y="439" font-family="system-ui" font-size="12" font-weight="400" fill="#254d45">Receipt or unknown outcome</text><text x="856" y="457" font-family="system-ui" font-size="12" font-weight="400" fill="#254d45">Reconcile before retry</text><path d="M260 433L295 433" stroke="#48776a" fill="none" stroke-width="2" marker-end="url(#ca)"/><path d="M530 433L565 433" stroke="#48776a" fill="none" stroke-width="2" marker-end="url(#ca)"/><path d="M800 433L835 433" stroke="#48776a" fill="none" stroke-width="2" marker-end="url(#ca)"/><rect x="30" y="530" width="490" height="95" rx="12" fill="#deeddf" stroke="#abc7b5"/><text x="46" y="559" font-family="system-ui" font-size="17" font-weight="650" fill="#254d45">Before marker: prevention can be established</text><text x="46" y="584" font-family="system-ui" font-size="12" font-weight="400" fill="#254d45">Only if every dispatch path enforces marker-before-send</text><text x="46" y="602" font-family="system-ui" font-size="12" font-weight="400" fill="#254d45">Fence stale workers; test bypass paths and cancellation races</text><rect x="580" y="530" width="490" height="95" rx="12" fill="#fff0ce" stroke="#abc7b5"/><text x="596" y="559" font-family="system-ui" font-size="17" font-weight="650" fill="#254d45">After marker: uncertainty is conservative</text><text x="596" y="584" font-family="system-ui" font-size="12" font-weight="400" fill="#254d45">Crash may happen before or after send; no receipt stays unknown</text><text x="596" y="602" font-family="system-ui" font-size="12" font-weight="400" fill="#254d45">Verified cancellation/completion needs evidence; compensation is new</text><text x="30" y="669" font-family="system-ui" font-size="13" font-weight="400" fill="#254d45">Design specification • implementation tests still required • no global exactly-once or atomic external-revocation guarantee</text></svg>