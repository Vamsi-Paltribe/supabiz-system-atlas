<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="880" viewBox="0 0 1320 880" role="img"><title>Proposed SupaBiz architecture with explicit ownership and trust boundaries</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#5a7668"/></marker></defs><rect width="1320" height="880" rx="24" fill="#e7ede3"/><g font-family="Arial" fill="#183c35"><text x="40" y="49" font-size="28" font-weight="700">One business system. Replaceable agents and adapters.</text><text x="40" y="79" font-size="17">Proposed v4 architecture · boxes are responsibilities, not a requirement for separate microservices</text><rect x="40" y="115" width="270" height="120" rx="12" fill="#fffef9" stroke="#b5c6b5"/><text x="58" y="145" font-size="20" font-weight="700">L01 · People</text><text x="58" y="173" font-size="16">Staff capture / manager review</text><text x="58" y="196" font-size="16">Owner and CA views</text><text x="58" y="219" font-size="16">Evidence beside the decision</text><rect x="350" y="115" width="270" height="120" rx="12" fill="#fffef9" stroke="#b5c6b5"/><text x="368" y="145" font-size="20" font-weight="700">L03 · Intake</text><text x="368" y="173" font-size="16">WhatsApp / Gmail / app</text><text x="368" y="196" font-size="16">Durable journal and cursors</text><text x="368" y="219" font-size="16">Quiet capture, scoped wake</text><rect x="660" y="115" width="270" height="120" rx="12" fill="#fffef9" stroke="#b5c6b5"/><text x="678" y="145" font-size="20" font-weight="700">L04 · Evidence</text><text x="678" y="173" font-size="16">Photos / PDF / voice / video</text><text x="678" y="196" font-size="16">Original + derived + locator</text><text x="678" y="219" font-size="16">Coverage and uncertainty</text><rect x="970" y="115" width="310" height="120" rx="12" fill="#fffef9" stroke="#b5c6b5"/><text x="988" y="145" font-size="20" font-weight="700">L05 · Records</text><text x="988" y="173" font-size="16">Typed facts, revisions and checks</text><text x="988" y="196" font-size="16">Separate scoped memory/search</text><text x="988" y="219" font-size="16">Postgres + object evidence</text><path d="M310 175L350 175" stroke="#5a7668" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M620 175L660 175" stroke="#5a7668" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M930 175L970 175" stroke="#5a7668" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="970" y="300" width="310" height="120" rx="12" fill="#fffef9" stroke="#b5c6b5"/><text x="988" y="330" font-size="20" font-weight="700">L06 · Harness</text><text x="988" y="358" font-size="16">Bounded context and model calls</text><text x="988" y="381" font-size="16">Versioned tool schemas</text><text x="988" y="404" font-size="16">Propose, clarify, checkpoint</text><rect x="660" y="300" width="270" height="120" rx="12" fill="#fffef9" stroke="#b5c6b5"/><text x="678" y="330" font-size="20" font-weight="700">L07 · Workflow</text><text x="678" y="358" font-size="16">Tasks / waits / reminders</text><text x="678" y="381" font-size="16">One durable progression owner</text><text x="678" y="404" font-size="16">No waiting model process</text><rect x="350" y="300" width="270" height="120" rx="12" fill="#fffef9" stroke="#b5c6b5"/><text x="368" y="330" font-size="20" font-weight="700">L08 · Action gateway</text><text x="368" y="358" font-size="16">Authorize exact current intent</text><text x="368" y="381" font-size="16">API or scoped browser adapter</text><text x="368" y="404" font-size="16">Verify / fail / reconcile</text><rect x="40" y="300" width="270" height="120" rx="12" fill="#fffef9" stroke="#b5c6b5"/><text x="58" y="330" font-size="20" font-weight="700">Verified result</text><text x="58" y="358" font-size="16">Provider receipt / reviewed result</text><text x="58" y="381" font-size="16">Preserve history and unknowns</text><text x="58" y="404" font-size="16">Shared authorized projections</text><path d="M1125 235L1125 300" stroke="#5a7668" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M970 360L930 360" stroke="#5a7668" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M660 360L620 360" stroke="#5a7668" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M350 360L310 360" stroke="#5a7668" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M175 300L175 235" stroke="#5a7668" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="475" width="1240" height="90" rx="12" fill="#183c35"/><text x="62" y="508" font-size="22" fill="#f4f3ec" font-weight="700">L02 · Identity, grants and secrets — enforced at every boundary</text><text x="62" y="540" font-size="17" fill="#e2ebd8">Business / matter / audience · credential broker · current grants · exact approval · revocation · budgets</text><rect x="40" y="615" width="390" height="120" rx="12" fill="#fffef9" stroke="#b5c6b5"/><text x="58" y="645" font-size="20" font-weight="700">L09 · Operating foundation</text><text x="58" y="673" font-size="16">Always-available intake and state</text><text x="58" y="696" font-size="16">Burst workers + scoped device sessions</text><text x="58" y="719" font-size="16">Leases / quotas / retention / restore</text><rect x="465" y="615" width="390" height="120" rx="12" fill="#fffef9" stroke="#b5c6b5"/><text x="483" y="645" font-size="20" font-weight="700">L10 · Evaluation and learning</text><text x="483" y="673" font-size="16">Protected stateful worlds and outcome tests</text><text x="483" y="696" font-size="16">Correction → scope → review → test → release</text><text x="483" y="719" font-size="16">One contract; optional Hue / Rystic adapters</text><rect x="890" y="615" width="390" height="120" rx="12" fill="#fffef9" stroke="#b5c6b5"/><text x="908" y="645" font-size="20" font-weight="700">L11 · Engineering</text><text x="908" y="673" font-size="16">Pinned packages and schema contracts</text><text x="908" y="696" font-size="16">CI / migrations / staged rollout</text><text x="908" y="719" font-size="16">Tools help build; they do not grant authority</text><text x="40" y="800" font-size="19" font-weight="700">Own the business contract. Reuse narrow infrastructure. Verify every protected effect.</text><text x="40" y="831" font-size="17">Model memory is not the ledger. Transport receipt is not completion. A passing signature is not factual truth.</text></g></svg>