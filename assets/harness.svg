<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">Two harnesses, different responsibilities</title><desc id="desc">The live runtime surrounds a replaceable model with context, state, policy, tools, validation and receipts. Traces feed the separate evaluation system, which uses fixtures, invariants and held-out scenarios to gate releases.</desc><g font-family="Arial,sans-serif"><text x="33" y="35" font-size="10" letter-spacing="2" fill="#a4c3ab">THE RUNTIME HARNESS</text><rect x="30" y="56" width="566" height="214" rx="9" stroke="#557c67" fill="#244c40"/><g fill="#315b49" stroke="#668b71"><rect x="52" y="78" width="152" height="42" rx="5"/><rect x="237" y="78" width="152" height="42" rx="5"/><rect x="422" y="78" width="152" height="42" rx="5"/><rect x="52" y="204" width="152" height="42" rx="5"/><rect x="237" y="204" width="152" height="42" rx="5"/><rect x="422" y="204" width="152" height="42" rx="5"/></g><g fill="#d1e1c7" text-anchor="middle" font-size="12"><text x="128" y="104">Scoped context</text><text x="313" y="104">Run state &amp; budgets</text><text x="498" y="104">Authority checks</text><text x="128" y="230">Typed tools</text><text x="313" y="230">Result validation</text><text x="498" y="230">Receipts &amp; recovery</text></g><g stroke="#779b7d" fill="none"><path d="M128 120v42h120M313 120v22M498 120v42H378M128 204v-42M313 204v-22M498 204v-42"/></g><rect x="233" y="141" width="160" height="42" rx="7" fill="#e3edce"/><text x="313" y="167" text-anchor="middle" font-size="13" fill="#32583b">Replaceable model</text><path d="M597 163h48" stroke="#8fae8a" stroke-dasharray="4 4"/><path d="m638 157 8 6-8 6" stroke="#8fae8a" fill="none"/><text x="622" y="145" text-anchor="middle" font-size="9" fill="#a4c3ab">traces</text><text x="671" y="35" font-size="10" letter-spacing="2" fill="#d1c8df">THE EVALUATION HARNESS</text><rect x="665" y="56" width="265" height="214" rx="9" fill="#3b4652" stroke="#75818c"/><g fill="#e4e4e7" font-size="12"><text x="690" y="91">01  Frozen regression fixtures</text><text x="690" y="123">02  Business &amp; security invariants</text><text x="690" y="155">03  Unseen workflow episodes</text><text x="690" y="187">04  Cost, latency &amp; failure checks</text></g><rect x="686" y="207" width="223" height="39" rx="4" fill="#515b66"/><text x="797" y="231" text-anchor="middle" fill="#dfe5d5" font-size="11">Evidence → release decision</text></g></svg>
